<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; img-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
  <link rel="stylesheet" href="{{style}}">
  <title>Vortex</title>
</head>
<body data-vortex-chat>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" />
  <path d="M12 5v14" /></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
  <circle cx="12" cy="12" r="3" /></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" />
  <path d="M19 12H5" /></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7" />
  <path d="M12 19V5" /></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" /></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
  <circle cx="12" cy="12" r="3" /></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18" />
  <path d="m6 6 12 12" /></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
  <path d="m15 5 4 4" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34" />
  <circle cx="11" cy="11" r="8" /></symbol>
    <symbol id="i-model" viewBox="0 0 24 24"><path d="M12 8V4H8" />
  <rect width="16" height="12" x="4" y="8" rx="2" />
  <path d="M2 14h2" />
  <path d="M20 14h2" />
  <path d="M15 13v2" />
  <path d="M9 13v2" /></symbol>
    <symbol id="i-new-chat" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
  <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" /></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
  <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" />
  <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
  <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></symbol>
    <symbol id="i-ask" viewBox="0 0 24 24"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><path d="M13 5h8" />
  <path d="M13 12h8" />
  <path d="M13 19h8" />
  <path d="m3 17 2 2 4-4" />
  <path d="m3 7 2 2 4-4" /></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6" />
  <path d="m8 6-6 6 6 6" /></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
  <path d="M8 16H3v5" /></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6" />
  <path d="M14 11v6" />
  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
  <path d="M3 6h18" />
  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></symbol>
  </defs></svg>
  <header class="header">
    <div class="conversation-heading"><button id="close-chat" class="icon-button" aria-label="Close chat and return home" title="Close chat and return home" hidden><svg><use href="#i-back"/></svg></button><div id="chat-heading" class="brand"><img src="{{logo}}" alt=""><span>Vortex</span></div></div>
    <nav aria-label="Ações da conversa"><button id="history-button" class="icon-button" aria-label="Search sessions" title="Search sessions"><svg aria-hidden="true"><use href="#i-search"/></svg></button><button id="new-task" class="icon-button" aria-label="Nova tarefa" title="Nova tarefa"><svg><use href="#i-new-chat"/></svg></button><button id="open-settings" class="icon-button" aria-label="Configurações" title="Configurações"><svg><use href="#i-settings"/></svg></button></nav>
  </header>
  <section id="chat-page" class="page chat-page" aria-label="Conversa">
    <section id="checklist" hidden><div class="section-heading"><strong>Implementation plan</strong><span id="checklist-progress"></span></div><ol id="checklist-items"></ol></section><main id="timeline" aria-label="Mensagens"><div id="welcome" class="welcome"><section id="recent-sessions" aria-label="Recent sessions"><div id="session-list"></div></section><img src="{{logo}}" alt="Vortex" class="empty-symbol"></div></main>
    <div id="chat-notice" class="notice" role="status" aria-live="polite"></div>
    <footer>
      <button id="connect-welcome" class="text-button connect-provider" hidden>Conectar provedor</button>
      <div class="composer">
        <div id="attached-context" class="attached-context" hidden></div>
        <label class="sr-only" for="prompt">Sua mensagem</label><textarea id="prompt" rows="1" placeholder="Ask about the project…" aria-describedby="draft-hint"></textarea>
        <div id="draft-hint" class="draft-hint" role="status" hidden></div>
        <div class="composer-toolbar">
          <button id="attach-context" class="icon-button attach-context" title="Add context" aria-label="Add context"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
          <label class="sr-only" for="mode">Modo</label><select id="mode" class="quiet-select" hidden><option value="ask" selected>Perguntar</option><option value="plan">Planejar</option><option value="agent">Agente</option></select><button id="mode-trigger" class="choice-trigger" aria-haspopup="menu" aria-expanded="false"><svg aria-hidden="true"><use href="#i-ask"/></svg><span>Ask</span></button>
          <button id="model-trigger" class="model-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="model-picker" title="Selecionar modelo"><span id="selected-model">Selecionar modelo</span><svg class="chevron"><use href="#i-chevron"/></svg></button>
          <div class="permissions"><label for="permission" class="sr-only">Política de aprovação</label><select id="permission" hidden class="quiet-select" title="Comandos de terminal sempre exigem aprovação"><option value="supervised">Supervisionado</option><option value="autonomous">Autônomo</option></select><button id="permission-trigger" class="choice-trigger" aria-haspopup="menu" aria-expanded="false"><svg aria-hidden="true"><use href="#i-hand"/></svg><span class="sr-only">Supervised</span><svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg></button><span id="read-only" hidden><svg aria-hidden="true"><use href="#i-eye"/></svg><span>Somente leitura</span></span></div>
          <button id="send" class="send-button icon-button" title="Enviar mensagem (Enter)" aria-label="Enviar mensagem"><svg><use href="#i-arrow"/></svg></button>
          <button id="stop" class="send-button icon-button" title="Interromper execução" aria-label="Interromper execução" hidden><svg><use href="#i-stop"/></svg></button>
        </div>
      </div>
      <div class="composer-meta"><button id="context-status" title="Estimated input usage; context is managed automatically">Context</button><span id="run-status" role="status">Pronto</span></div>
      <section id="model-picker" class="model-picker" role="dialog" aria-label="Selecionar modelo" hidden>
        <div class="picker-search"><svg><use href="#i-search"/></svg><input id="model-search" type="search" placeholder="Buscar modelo ou provedor…" aria-label="Buscar modelo ou provedor"><button id="refresh-models" class="icon-button" aria-label="Refresh models" title="Refresh models"><svg aria-hidden="true"><use href="#i-refresh"/></svg></button><button id="close-picker" class="icon-button" aria-label="Fechar modelos"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
        <div id="model-options" class="model-options"></div>
        <button id="manage-models" class="picker-footer"><svg><use href="#i-plus"/></svg>Gerenciar provedores e modelos</button>
      </section>
    </footer>
  </section><div id="choice-menu" role="menu" class="choice-menu" hidden></div><dialog id="sessions-dialog"><div class="section-heading"><h2>Sessions</h2><button id="close-sessions" class="icon-button" aria-label="Close"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><input id="session-search" type="search" placeholder="Search conversations…" aria-label="Search conversations"><div id="sessions-results"></div></dialog>
  <script nonce="{{nonce}}" src="{{shared}}"></script><script nonce="{{nonce}}" src="{{vendor}}"></script><script nonce="{{nonce}}" src="{{picker}}"></script><script nonce="{{nonce}}" src="{{script}}"></script>
</body>
</html>
