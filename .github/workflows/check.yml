name: Validate Vortex
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        run: npm run compile && node --test test/native.test.cjs test/actions.test.cjs test/providers.test.cjs
      - if: runner.os != 'Windows'
        run: npm run test:tls
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-${{ matrix.os }}
          path: vortex-agent.vsix
