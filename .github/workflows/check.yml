name: Validate Vortex
on:
  push:
  pull_request:
  workflow_call:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22, 24]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:tls
      - if: runner.os == 'Linux'
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
        timeout-minutes: 5
      - if: runner.os != 'Linux'
        run: node node_modules/playwright-core/cli.js install chromium
        timeout-minutes: 5
      - if: runner.os != 'Linux'
        run: npm run test:ui && npm run test:host
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'npm run test:ui && npm run test:host'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            vortex-agent.vsix
            test-results/
  minimum-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:host
        env:
          VSCODE_VERSION: 1.96.0
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker pull node:22-bookworm-slim
      - run: npm run test:sandbox
        env:
          VORTEX_REQUIRE_SANDBOX: '1'
